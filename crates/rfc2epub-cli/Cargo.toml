[package]
name = "rfc2epub-cli"
description = "Command-line tool to convert IETF RFCs into EPUB files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rfc2epub"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
indicatif = "0.18.6"
owo-colors = "4.3.0"
rfc2epub = { version = "0.1.0", path = "../rfc2epub" }

[package]
name = "rfc2epub"
description = "Convert IETF RFCs into clean, reflowable EPUB files for e-readers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
comrak = "0.54"
directories = "6.0.0"
epub-builder = "0.8.3"
html-escape = "0.2.14"
math-core = "0.7"
merman = { version = "0.7.0", optional = true, default-features = false, features = ["render"] }
regex = "1.13.1"
resvg = "0.45.1"
roxmltree = "0.21.1"
syntect = "5.3"
thiserror = "2.0.19"
two-face = "0.5"
ureq = "3.3.0"
uuid = { version = "1.24.0", features = ["v5"] }

[features]
default = ["mermaid"]
# In-process Mermaid diagram rendering via `merman` (pure Rust, export-safe SVG).
# On by default; requires rustc >= 1.95 (merman's MSRV). Build with
# `--no-default-features` for a leaner binary that falls back to showing a
# mermaid diagram's source verbatim.
mermaid = ["dep:merman"]
